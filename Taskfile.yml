version: '3'

includes:
  client:
    taskfile: ./client/Taskfile.yml
    dir: ./client

tasks:
  serve:
    desc: Build the frontend and run stock PocketBase locally on :8090 (serves build/pb_public)
    deps: [client:build]
    cmds:
      - ./scripts/get-pocketbase.sh
      # Run from build/ so ./pb_public and ./pb_data resolve next to the binary (mirrors the Docker /app layout)
      - cd build && ./pocketbase serve

  test:
    desc: Run frontend unit tests
    cmds:
      - task client:test

  deploy:
    desc: Deploy the full stack to fly.io (the Docker image builds the frontend and bundles PocketBase)
    cmds:
      - flyctl deploy --config iac/fly.toml

  default:
    internal: true
    cmds:
      - task --list
