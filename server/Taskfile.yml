version: '3'

tasks:
  init:
    desc: Download Go dependencies (run once after cloning)
    cmds:
      - go mod tidy

  build:
    desc: Compile the PocketBase binary to build/pocketbase
    cmds:
      - go build -mod=vendor -o ../build/pocketbase .

  dev:
    desc: Run PocketBase locally (serves on :8090)
    deps: [build]
    cmds:
      # Run from build/ so ./pb_public and ./pb_data resolve next to the binary (mirrors the Docker /app layout)
      - cd ../build && ./pocketbase serve

  watch:
    desc: Watch Go files and restart the server on changes
    watch: true
    sources:
      - '*.go'
      - go.mod
    cmds:
      # Run from build/ so ./pb_public and ./pb_data resolve next to the binary (mirrors the Docker /app layout)
      - go build -mod=vendor -o ../build/pocketbase . && cd ../build && ./pocketbase serve
